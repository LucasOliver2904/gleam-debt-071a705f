plugins {
    id 'com.android.application'
}
android {
    namespace 'app.meucaixa.privatecompanion'
    compileSdk 35
    defaultConfig {
        applicationId 'app.meucaixa.privatecompanion'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-private'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
