name: Preparar dependencia OCR privada
on:
  push:
    branches: ["feat/private-statement-ocr-20261113"]
    paths: ["package.json"]
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Atualizar lockfile do OCR
        run: bun install
      - name: Registrar dependencias resolvidas
        shell: bash
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: lock Tesseract OCR browser dependency"
            git push origin HEAD:feat/private-statement-ocr-20261113
          fi
