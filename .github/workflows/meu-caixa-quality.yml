name: Validar Meu Caixa
on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, compilação e acesso HTTP real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Gerar rotas e compilar aplicação
        run: bun run build
      - name: Testar acesso HTTP ao servidor
        run: bash scripts/smoke-http.sh
      - name: Validar TypeScript
        run: bun x tsc --noEmit
      - name: Auditar lint (informativo)
        run: bun run lint
        continue-on-error: true
      - name: Rodar testes
        run: bun run test
