name: Validar Meu Caixa
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Gerar rotas e compilar aplicação
        run: bun run build
      - name: Validar TypeScript
        run: bun x tsc --noEmit
      - name: Auditar lint (informativo)
        run: bun run lint
        continue-on-error: true
      - name: Rodar testes
        run: bun run test
