name: Gerar ícones oficiais do Meu Caixa
on:
  push:
    branches: ["fix/meu-caixa-android-ssr-icon-20261116"]
    paths:
      - "public/icons/icon.svg"
      - "scripts/generate-app-icons.py"
      - ".github/workflows/generate-meu-caixa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar PNG e ICO a partir do SVG original
        run: |
          python -m pip install --quiet "cairosvg>=2.7,<3" "pillow>=10,<13"
          python scripts/generate-app-icons.py
      - name: Salvar os ícones na branch privada
        run: |
          git add public/favicon.png public/favicon.ico public/apple-touch-icon.png public/icons/icon-192.png public/icons/icon-512.png public/icons/icon-maskable-512.png src/assets/app-icon.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: update official Meu Caixa PNG/PWA/Android icons"
            git push origin HEAD:fix/meu-caixa-android-ssr-icon-20261116
          fi
