name: Atualizar ícones Prumo Teal
on:
  push:
    branches: ["feat/prumo-teal-pwa-refresh-20261117"]
    paths:
      - "public/icons/icon.svg"
      - ".github/workflows/generate-prumo-teal-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter arte vetorial
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recriar ícones PNG, maskable e favicon
        run: |
          python -m pip install --quiet "cairosvg>=2.7,<3" "pillow>=10,<13"
          python scripts/generate-app-icons.py
      - name: Salvar novos ícones no repositório privado
        run: |
          git add public/favicon.png public/favicon.ico public/apple-touch-icon.png public/icons/icon-192.png public/icons/icon-512.png public/icons/icon-maskable-512.png src/assets/app-icon.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets(prumo): regenerate teal PWA icons for Android and browser"
            git push origin HEAD:feat/prumo-teal-pwa-refresh-20261117
          fi
