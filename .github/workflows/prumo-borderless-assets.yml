name: Gerar ícones Prumo sem moldura
on:
  push:
    branches: ["fix/prumo-icon-no-black-border-20261117"]
    paths:
      - "public/icons/icon.svg"
      - "scripts/generate-app-icons.py"
      - ".github/workflows/prumo-borderless-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recriar PNG e verificar bordas
        run: |
          python -m pip install --quiet "cairosvg>=2.7,<3" "pillow>=10,<13"
          python scripts/generate-app-icons.py
      - name: Salvar arquivos gerados
        run: |
          git add public/favicon.png public/favicon.ico public/apple-touch-icon.png public/icons/icon-192.png public/icons/icon-512.png public/icons/icon-maskable-512.png src/assets/app-icon.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: remove black edges from Prumo launcher icon"
            git push origin HEAD:fix/prumo-icon-no-black-border-20261117
          fi
