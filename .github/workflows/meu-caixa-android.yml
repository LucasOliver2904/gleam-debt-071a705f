name: Meu Caixa Android - instalador privado

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "android-companion/**"
      - ".github/workflows/meu-caixa-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-companion/**"
      - ".github/workflows/meu-caixa-android.yml"

permissions:
  contents: read

jobs:
  android-debug:
    name: Compilar APK Android sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código privado
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android gratuita
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK privado para teste
        run: gradle --no-daemon -p android-companion :app:assembleDebug
      - name: Verificar o pacote
        run: |
          test -s android-companion/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android-companion/app/build/outputs/apk/debug/app-debug.apk | grep -q "AndroidManifest.xml"
      - name: Disponibilizar instalador apenas no repositório privado
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Caixa-Android-Privado-APK
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
